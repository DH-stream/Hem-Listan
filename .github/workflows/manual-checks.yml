name: Manual checks

on:
  workflow_dispatch:
    inputs:
      ref:
        description: Branch, tag, or commit SHA to check
        required: false
        default: add-passive-pricing-match-quality-signals

permissions:
  contents: read

jobs:
  checks:
    name: Test and lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      - name: Run TypeScript lint
        run: npm run lint
